# frankenbasix rust bootstrap configuration
#
# builds rustc + cargo for x86_64-unknown-linux-musl, seeded by the prebuilt
# musl toolchain rust-bootstrap installs at /usr/lib/rust1.93.1
#
# frankenbasix ships musl as the shared system libc, so the target section
# overrides rustc's static-by-default musl preference (the 0001-* patch flips
# the baked-in default, this makes sure every stage of this build agrees):
# binaries link against /lib/ld-musl and libc.so instead of bundling libc.a,
# no bundled crt objects or self-contained components, system musl headers
# and libraries at /usr

[build]
build = "x86_64-unknown-linux-musl"
host = ["x86_64-unknown-linux-musl"]
target = ["x86_64-unknown-linux-musl"]
cargo = "/usr/lib/rust1.93.1/bin/cargo"
rustc = "/usr/lib/rust1.93.1/bin/rustc"
vendor = true
submodules = false
docs = false
extended = true
# "src" (not "rust-src") is the exact name the install step checks for
# (bootstrap install.rs: Src::is_default_step does tools.contains("src")),
# without it the rust-src component never gets installed
tools = ["cargo", "rust-src", "src", "rustdoc", "rustfmt", "clippy"]

[install]
prefix = "/usr"
sysconfdir = "/etc"

[llvm]
download-ci-llvm = false

[rust]
# sccache (RUSTC_WRAPPER in the template) cannot cache incremental builds
incremental = false

[target.x86_64-unknown-linux-musl]
crt-static = false
musl-root = "/usr"
rustflags = ["-C", "link-self-contained=no"]
